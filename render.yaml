services:
  - type: web
    name: fullstack
    buildCommand: |
      echo "Building frontend..."
      cd part2-notes-frontend
      npm install
      npm run build
      echo "Copying frontend to backend..."
      cp -r dist ../part3-notes-backend/
      echo "Installing backend dependencies..."
      cd ../part3-notes-backend
      npm install
    startCommand: cd part3-notes-backend && node index.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: puhelinluettelo-backend
    buildCommand: cd osa3/puhelinluettelonbackend && npm install
    startCommand: cd osa3/puhelinluettelonbackend && npm start
    envVars:
      - key: NODE_ENV
        value: production